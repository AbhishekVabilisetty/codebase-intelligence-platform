version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/cache:/app/cache
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/temp_repos:/app/temp_repos
    restart: unless-stopped

  frontend:
    image: python:3.11-slim
    working_dir: /app
    command: python -m http.server 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    restart: unless-stopped
